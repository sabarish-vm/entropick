name: Tests

on:
  push:

permissions:
  contents: write

jobs:
  run-tests:
    name: Run tests
    runs-on: ${{ matrix.os }}
    if: |
      !contains(github.event.commits[0].message, '[skip tests]')

    strategy:
      matrix:
        include:
          - build: linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu

          - build: macos
            os: macos-latest
            target: aarch64-apple-darwin

          - build: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Run Tests
        shell: bash
        run: cargo test --verbose -- --test-threads=1
