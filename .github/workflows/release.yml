name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build and upload
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - build: linux64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl

          - build: linuxARM
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl

          - build: macos
            os: macos-latest
            target: aarch64-apple-darwin

          - build: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Version from cargo
        shell: bash
        run: |
          echo "CARGO_VERSION=$(cargo pkgid | sed -E 's/.*#(.*)/\1/g')" >> $GITHUB_ENV

      - name: Get the release version from the tag
        shell: bash
        run: |
          temp_VERSION="${GITHUB_REF#refs/tags/}"
          echo "TAG_VERSION=${temp_VERSION#v}" >> $GITHUB_ENV

      - name: Compare the versions
        shell: bash
        run: |
          [ "${{env.TAG_VERSION}}" = "${{env.CARGO_VERSION}}" ]

      - name: Version check
        shell: bash
        run: |
          echo
          echo "CARGO_VERSION=${{ env.CARGO_VERSION }}"
          echo "TAG_VERSION=${{ env.TAG_VERSION }}"
          echo

      - name: Cargo build
        run: cargo build --verbose --release --target ${{ matrix.target }}

      - name: Build archive
        shell: bash
        run: |
          binary_name="entropick"
          executable="target/${{ matrix.target }}/release/$binary_name"
          dirname="$binary_name-${{ env.VERSION }}-${{ matrix.target }}"
          mkdir "$dirname"
          mkdir "completions"
          "$executable" completions bash > "completions/${binary_name}.bash"
          "$executable" completions zsh > "completions/_${binary_name}"
          "$executable" completions fish > "completions/${binary_name}.fish"
          "$executable" completions elvish > "completions/${binary_name}.elv"
          "$executable" completions powershell > "completions/${binary_name}.ps1"
          cp -r completions "$dirname/"

          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            mv "target/${{ matrix.target }}/release/$binary_name.exe" "$dirname"
          else
            mv "target/${{ matrix.target }}/release/$binary_name" "$dirname"
          fi

          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a "$dirname.zip" "$dirname"
            echo "ASSET=$dirname.zip" >> $GITHUB_ENV
          else
            tar -czf "$dirname.tar.gz" "$dirname"
            echo "ASSET=$dirname.tar.gz" >> $GITHUB_ENV
          fi

      - name: Release
        uses: softprops/action-gh-release@v3
        if: github.actor != 'nektos/act'
        with:
          files: |
            ${{ env.ASSET }}
