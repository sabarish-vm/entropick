[package]
name = "entropick"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", default-features = false, features = [
    "help",
    "usage",
    "suggestions",
] }
rand = { version = "0.10.3", default-features = false, features = [
    "chacha",
    "sys_rng",
] }
secrecy = "0.10"
zeroize = { version = "1.9", features = ["derive"] }
toml = { version = "1", default-features = false, features = [
    "parse",
    "display",
    "serde",
] }
serde = { version = "1", features = ["derive"] }
clap_complete = "4.6.11"
zxcvbn = { version = "3.1.1", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"
